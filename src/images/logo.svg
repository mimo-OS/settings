<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#303848" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101824" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#ebedf2"/>
      <stop offset="100%" stop-color="#d1d6e0"/>
    </linearGradient>
    <linearGradient id="gearMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0a8b6"/>
      <stop offset="25%" stop-color="#7a8494"/>
      <stop offset="50%" stop-color="#949dae"/>
      <stop offset="75%" stop-color="#6c7686"/>
      <stop offset="100%" stop-color="#8c96a8"/>
    </linearGradient>
    <radialGradient id="gearShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="innerHub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#464e5c"/>
      <stop offset="100%" stop-color="#646d7e"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Shadow Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" filter="url(#shadow)" fill="#d1d6e0"/>

  <g clip-path="url(#squircleClip)">
    <!-- Base Squircle -->
    <rect x="24" y="24" width="464" height="464" fill="url(#squircleBg)"/>

    <!-- Subtle Inset Shadow on Base -->
    <circle cx="256" cy="256" r="185" fill="#000000" opacity="0.06"/>

    <!-- The Metallic Gear (10 Teeth) -->
    <g transform="translate(256, 256)" filter="drop-shadow(0 10px 14px rgba(0, 0, 0, 0.28))">
      <!-- Gear Outline Path (10 Teeth with chamfers) -->
      <path d="
        M 0,-175 L 26,-175 L 34,-145 C 50,-140 65,-132 78,-122 L 106,-136 L 126,-116 L 112,-88 C 122,-75 130,-60 135,-44 L 165,-36 L 165,0 L 165,36 L 135,44 C 130,60 122,75 112,88 L 126,116 L 106,136 L 78,122 C 65,132 50,140 34,145 L 26,175 L -26,175 L -34,145 C -50,140 -65,132 -78,122 L -106,136 L -126,116 L -112,88 C -122,75 -130,60 -135,44 L -165,36 L -165,-36 L -135,-44 C -130,-60 -122,-75 -112,-88 L -126,-116 L -106,-136 L -78,-122 C -65,-132 -50,-140 -34,-145 L -26,-175 Z
      " fill="url(#gearMetal)" stroke="#505866" stroke-width="2"/>

      <!-- Gear Specular Surface -->
      <circle cx="0" cy="0" r="145" fill="url(#gearShine)"/>

      <!-- Outer Groove Ring -->
      <circle cx="0" cy="0" r="128" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
      <circle cx="0" cy="0" r="126" fill="none" stroke="#3c4350" stroke-width="2" opacity="0.6"/>

      <!-- Intermediate Ring -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#2a303c" stroke-width="3" opacity="0.5"/>
      <circle cx="0" cy="0" r="103" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

      <!-- Central Recessed Hub -->
      <circle cx="0" cy="0" r="82" fill="url(#innerHub)" stroke="#222832" stroke-width="4"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

      <!-- Center Hole (Dark Deep Axle) -->
      <circle cx="0" cy="0" r="54" fill="#181c24" stroke="#0e1116" stroke-width="3"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
      <!-- Inner Hole Axle Key Notch -->
      <rect x="-10" y="-58" width="20" height="12" rx="3" fill="#181c24"/>
    </g>

    <!-- Outer Squircle Rim Light -->
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#rimLight)" stroke-width="4"/>
  </g>
</svg>
